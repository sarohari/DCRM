{% extends "base.html" %}

{% block title %}Sign in · Duroflex CRM{% endblock %}

{% block content %}
  <h1>Sign in</h1>
  {% if form.errors %}
    <p role="alert">The email/phone or password is incorrect.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div>
      <label for="id_username">Email or phone</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    </div>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
