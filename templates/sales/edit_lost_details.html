{% extends "base.html" %}

{% block title %}Edit Lost details · Duroflex CRM{% endblock %}

{% block content %}
  <h1>Edit Lost details</h1>
  <p>{{ lead.customer.name }} · {{ lead.product_category.name }}. Only the Owner can edit these details.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
    <a href="{% url 'lead_detail' lead.pk %}">Cancel</a>
  </form>
{% endblock %}
